<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5597">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <title>Pedido — Malhas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tela-pedido">
  <header class="topbar">
    <a class="btn icone" href="./" aria-label="Voltar para a lista">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="so-desktop">Pedidos</span>
    </a>
    <div class="titulo-bloco">
      <h1 data-titulo>Pedido</h1>
      <span class="estado" data-estado></span>
    </div>
    <span class="spacer"></span>
    <select id="status" class="status-select" aria-label="Situação do pedido">
      <option value="rascunho">Rascunho</option>
      <option value="enviado">Enviado</option>
      <option value="aprovado">Aprovado</option>
      <option value="cancelado">Cancelado</option>
    </select>
    <div class="acoes so-desktop">
      <label class="chave chave-barra" title="Mostra a coluna de comissão (informativa) em cada item"><input type="checkbox" data-comissao><span class="trilho"></span><span>Comissão</span></label>
      <button class="btn" data-acao="visualizar">Visualizar</button>
      <button class="btn" data-acao="gerar-servico" hidden>Gerar nota de serviço</button>
      <button class="btn" data-acao="duplicar">Duplicar</button>
      <div class="menu">
        <button class="btn" data-abrir-menu>Compartilhar ▾</button>
        <div class="menu-itens">
          <button data-share="pdf">Baixar PDF</button>
          <button data-share="nativo">Compartilhar resumo…</button>
          <button data-share="whatsapp">WhatsApp (resumo)</button>
          <button data-share="email">E-mail (resumo)</button>
          <button data-share="copiar" class="so-servidor">Copiar link (somente leitura)</button>
        </div>
      </div>
      <button class="btn" data-acao="imprimir">Imprimir</button>
      <button class="btn primario" data-acao="salvar">Salvar</button>
    </div>
  </header>

  <main id="pedido">
    <div class="area area-folha">
      <div class="folha">
        <div id="folha"><div class="vazio">Carregando…</div></div>
        <div class="rodape-folha"><span>Enter desce para a próxima linha · Ctrl+S salva · alterações são salvas automaticamente</span><span id="atualizado"></span></div>
      </div>
    </div>
    <div id="app-form" class="app-form"></div>
  </main>

  <nav class="barra-app" aria-label="Ações do pedido">
    <div class="barra-total"><small>Total do pedido</small><strong>R$ <span data-t="total">-</span></strong></div>
    <button type="button" class="btn-acoes" data-abrir-sheet="sheetAcoes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Ações</span></button>
  </nav>

  <dialog class="sheet sheet-menu" id="sheetAcoes" aria-label="Ações do pedido">
    <div class="sheet-corpo">
      <div class="sheet-alca" aria-hidden="true"></div>
      <div class="sheet-topo">
        <h3>Ações</h3>
        <button type="button" class="sheet-fechar" data-fechar-sheet aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="acoes-lista">
        <button type="button" data-acao="visualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Visualizar documento</span></button>
        <button type="button" data-share="pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></svg><span>Compartilhar PDF</span></button>
        <button type="button" data-share="whatsapp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.7-5.2A8.4 8.4 0 1 1 21 11.5z"/></svg><span>Enviar resumo por WhatsApp</span></button>
        <button type="button" data-share="email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg><span>Enviar resumo por e-mail</span></button>
        <button type="button" data-share="copiar" class="so-servidor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span>Copiar link (somente leitura)</span></button>
        <button type="button" data-acao="imprimir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Imprimir</span></button>
        <button type="button" data-acao="gerar-servico" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg><span>Gerar nota de serviço</span></button>
        <button type="button" data-acao="duplicar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Duplicar pedido</span></button>
        <label class="acao-chave">
          <span>Mostrar comissão<small>Coluna informativa em cada item (aparece no PDF e na impressão)</small></span>
          <span class="chave"><input type="checkbox" data-comissao><span class="trilho"></span></span>
        </label>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modelos.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/empresa.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/folha.js"></script>
</body>
</html>
